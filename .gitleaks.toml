# gitleaks configuration: the default rules, unchanged, plus the one path
# exclusion the owner approved (2026-11-19). Nothing else is excluded and no
# rule is disabled or loosened; a one-off false positive gets a
# `gitleaks:allow` comment on its line instead. See singularity's
# guidelines/workflow/secret-scanning.md.

[extend]
useDefault = true

[[allowlists]]
description = "Generated API models provenance: content hashes, not secrets"
paths = [
    '''^src/app/core/generated/\.provenance\.json$''',
]
